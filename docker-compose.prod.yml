# Single-host production stack (docker compose) — the deployment that runs today on one
# workstation behind a Cloudflare Tunnel. Kubernetes uses charts/yuzdanyuz instead.
# Docs: packages/backend/docs/deployment/compose-single-host.md
#
#   docker compose -p mashqgoh -f docker-compose.prod.yml \
#     --env-file <dir>/compose.env up -d --build
#
# Secrets never live in the repository. Two files outside git (generate-secrets in the
# doc above):
#   compose.env  interpolation only: REDIS_PASSWORD, DB_PASSWORD, POSTGRES_PASSWORD,
#                DB_MIGRATE_PASSWORD, DB_BACKUP_PASSWORD, APP_ENV_FILE, PUBLIC_PORT
#   app.env      the backend's own settings (path in APP_ENV_FILE), core.settings.prod
#
# Data lives in named volumes with fixed names, so a different project name or a fresh
# checkout reattaches the same data. Nothing here creates an anonymous volume.

x-backend: &backend
  build:
    context: .
    dockerfile: docker/Dockerfile.backend
    args:
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
  image: yuzdanyuz-backend:prod
  env_file:
    - ${APP_ENV_FILE:?set APP_ENV_FILE to the app.env path}
  environment: &backend-env
    DJANGO_SETTINGS_MODULE: core.settings.prod
    DB_HOST: pgbouncer
    DB_PORT: "6432"
    DB_POOLER: pgbouncer
    DB_NAME: yuzdanyuz_db
    DB_USER: yuzdanyuz
    DB_PASSWORD: ${DB_PASSWORD:?}
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/1
    CHANNELS_REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/2
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    # Every request reaches Django through nginx on this network (cloudflared runs on
    # the host and enters via the Docker gateway), so only this subnet is a proxy.
    TRUSTED_PROXY_CIDRS: 10.99.77.0/24
  depends_on:
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: always
  networks: [app]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "yuzdanyuz_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256m
    mem_limit: 1g
    restart: always
    networks: [app]

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      AUTH_TYPE: scram-sha-256
      AUTH_FILE: /etc/pgbouncer-run/userlist.txt
      DB_USER: yuzdanyuz
      DB_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    tmpfs:
      - /etc/pgbouncer-run
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: always
    networks: [app]

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    restart: always
    networks: [app]

  # One-shot: migrations as the schema owner, straight to Postgres (no PgBouncer), then
  # DML grants for the runtime role (core/db_roles.py). Every app service waits for it.
  migrate:
    <<: *backend
    command: ["migrate"]
    environment:
      <<: *backend-env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_POOLER: ""
      DB_USER: yuzdanyuz_owner
      DB_PASSWORD: ${DB_MIGRATE_PASSWORD:?}
      DB_RUNTIME_ROLE: yuzdanyuz
      DB_STATEMENT_TIMEOUT_MS: "0"
      MIGRATE_COLLECTSTATIC: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    command: ["web"]
    environment:
      <<: *backend-env
      GUNICORN_WORKERS: "3"
    volumes:
      - mediadata:/app/media
    mem_limit: 1g

  channels:
    <<: *backend
    command: ["asgi"]
    mem_limit: 512m

  # Every queue routed in packages/backend/core/celery.py has a consumer: the default
  # worker takes all but `ai`, which has its own capped worker (one Claude subscription).
  celery-worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      DB_NAME: yuzdanyuz_db_worker
      CELERY_QUEUES: default,celery,critical,realtime,batch
      CELERY_CONCURRENCY: "2"
    volumes:
      - mediadata:/app/media
    # The image healthcheck probes gunicorn on :8000; a worker answers a broker ping
    # instead (same probe as the Helm chart).
    healthcheck: &worker-health
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 60s
      retries: 3
    mem_limit: 1g

  celery-ai:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      DB_NAME: yuzdanyuz_db_worker
      CELERY_QUEUES: ai
      CELERY_CONCURRENCY: "2"
    volumes:
      - mediadata:/app/media
    healthcheck: *worker-health
    mem_limit: 1g

  celery-beat:
    <<: *backend
    command: ["beat"]
    # Beat serves nothing to probe; restart: always covers a crash.
    healthcheck:
      disable: true
    mem_limit: 256m

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    image: yuzdanyuz-frontend:prod
    mem_limit: 512m
    restart: always
    networks: [app]

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    image: yuzdanyuz-nginx:prod
    volumes:
      - ./docker/nginx/compose-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - mediadata:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    # Loopback only: the Cloudflare Tunnel on this host is the one public entry.
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8330}:8080"
    mem_limit: 128m
    restart: always
    networks: [app]

networks:
  app:
    ipam:
      config:
        - subnet: 10.99.77.0/24

volumes:
  pgdata:
    name: mashqgoh_pgdata
  redisdata:
    name: mashqgoh_redisdata
  mediadata:
    name: mashqgoh_mediadata
