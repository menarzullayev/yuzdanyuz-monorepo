# Pre-commit hooks for yuzdanyuz-monorepo
# Setup: `pre-commit install && pre-commit install --hook-type pre-push`
# Bypass (NOT recommended): `git commit --no-verify` or `git push --no-verify`

default_language_version:
  python: python3.11

# ──────────────────────────────────────────────────────────────────────
# pre-commit stage — har commit'da (tezkor checks, < 5 sek)
# ──────────────────────────────────────────────────────────────────────
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Helm templates contain Go template syntax — not parseable as YAML.
        # Argo CD CRDs use kebab-case keys ('-' as the first key char) which the
        # naive YAML parser also chokes on; both are validated by `helm lint`
        # in CI instead (see .github/workflows/build-and-push.yml).
        exclude: ^(charts/.*/templates/.*\.yaml|argocd/)
      - id: check-json
        exclude: ^\.vscode/   # VS Code uses JSONC (JSON with Comments)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ── Python lint + format (ultra-tezkor) ─────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^packages/backend/.*\.py$
      - id: ruff-format
        files: ^packages/backend/.*\.py$

  # ──────────────────────────────────────────────────────────────────────
  # pre-push stage — push'dan oldin (chuqur tekshiruv)
  # ──────────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: django-system-check
        name: Django system check
        entry: bash -c 'cd packages/backend && ./venv/bin/python manage.py check --deploy 2>&1 || ./venv/bin/python manage.py check'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^packages/backend/

      # pre-commit framework runs hooks of the same stage in parallel by default.
      # All three pytest hooks share one Postgres test DB (test_yuzdanyuz_db with
      # --reuse-db); concurrent runs deadlock on unique constraints
      # (organizations_organization_slug_key) and duplicate-insert
      # django_content_type rows. require_serial: true forces them to run one at
      # a time so each pytest invocation has the DB to itself.
      - id: pytest-unit
        name: Pytest — unit tests
        entry: bash -c 'cd packages/backend && ./venv/bin/python -m pytest tests/unit/ apps/*/tests.py -x --tb=short -q'
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
        files: ^packages/backend/

      - id: pytest-integration
        name: Pytest — integration tests
        entry: bash -c 'cd packages/backend && ./venv/bin/python -m pytest tests/integration/ -x --tb=short -q'
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
        files: ^packages/backend/

      - id: pytest-security
        name: Pytest — security tests
        entry: bash -c 'cd packages/backend && ./venv/bin/python -m pytest tests/security/ -x --tb=short -q'
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
        files: ^packages/backend/
