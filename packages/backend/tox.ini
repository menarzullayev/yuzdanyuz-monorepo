# ISSUE-X02 — Fresh-venv CI mirror via tox.
#
# Lesson 17 root-cause: pre-push hooks ran in the developer's local venv, so a
# missing entry in requirements/common.txt (e.g. whitenoise) only failed in CI.
# This tox config installs into an ISOLATED venv on every invocation, mirroring
# CI exactly.
#
# Usage:
#   tox                  # default env: full lint + tests in fresh venv
#   tox -e lint          # only ruff
#   tox -e tests         # only pytest
#   tox -e djangocheck   # only `manage.py check --deploy`
#
# `tox` is NOT installed by default — `pip install tox` once per dev env.
# CI/CD `.github/workflows/ci.yml` already runs in a fresh venv per job, so
# this file is primarily for local pre-push parity.

[tox]
envlist = py312-{lint,djangocheck,tests}
isolated_build = False
skipsdist = True

[testenv]
deps =
    -r{toxinidir}/requirements/common.txt
    -r{toxinidir}/requirements/development.txt
setenv =
    DJANGO_SETTINGS_MODULE = core.settings.test
    PYTHONDONTWRITEBYTECODE = 1
passenv =
    DATABASE_URL
    REDIS_URL

[testenv:py312-lint]
description = Ruff lint + format check (fresh venv)
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:py312-djangocheck]
description = Django system check (fresh venv)
commands =
    python manage.py check --deploy --fail-level WARNING

[testenv:py312-tests]
description = Full pytest suite (fresh venv) — mirrors CI exactly
commands =
    pytest tests/ -x --no-header -p no:cacheprovider
