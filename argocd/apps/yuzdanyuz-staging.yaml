apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yuzdanyuz-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: yuzdanyuz
  source:
    repoURL: https://github.com/menarzullayev/yuzdanyuz-monorepo.git
    targetRevision: main
    path: charts/yuzdanyuz
    helm:
      releaseName: yuzdanyuz
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: yuzdanyuz-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
