# Prometheus config for the local compose monitoring stack:
#   docker compose --profile monitoring up -d
# In Kubernetes the chart's ServiceMonitor/PodMonitor/PrometheusRule replace this file
# (docs/deployment/monitoring.md). Job names match the chart's relabelled `job` labels,
# which the alert rules select on.

global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/prometheus-rules.yml   # charts/yuzdanyuz/files/prometheus-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: yuzdanyuz-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
        labels: {namespace: compose}

  - job_name: yuzdanyuz-celery-worker
    static_configs:
      - targets: ['celery-worker:9540', 'celery-ai:9540']
        labels: {namespace: compose}

  - job_name: yuzdanyuz-celery-exporter
    static_configs:
      - targets: ['celery-exporter:9808']
        labels: {namespace: compose}

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
