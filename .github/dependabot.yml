version: 2

updates:
  # Commit messages: `prefix: chore` + `include: scope` gives `chore(deps): ...`
  # (`chore(deps-dev): ...` for dev dependencies). A prefix that already has a
  # scope, like `chore(deps)`, came out as `chore(deps)(deps): ...`.
  # Backend Python dependencies (version updates; the fetcher also reads the
  # requirements/ folder). The dependency-graph job is scheduled separately, on
  # the folder that holds the requirements files, whatever this directory says;
  # packages/backend/requirements/requirements.txt is what keeps it fed.
  - package-ecosystem: pip
    directory: /packages/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - backend
    ignore:
      # Stay on the 5.2 LTS line (security fixes until 2028-04). Django 6.0 is not
      # LTS (fixes end ~2027-04) and 6.1 is blocked by django-celery-beat 2.9.0 and
      # django-prometheus 2.5.0 (<6.1). Move to 6.2 LTS once those support it.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
    groups:
      django:
        patterns:
          - "django*"
      testing:
        patterns:
          - "pytest*"
          - "factory-boy"
          - "coverage"
      # The OpenTelemetry distro pins exact instrumentation/exporter versions,
      # so single-package bumps never resolve.
      opentelemetry:
        patterns:
          - "opentelemetry-*"

  # npm workspaces (root package-lock.json covers packages/frontend-web and
  # packages/shared). A separate /packages/frontend-web entry produced PRs that
  # changed package.json without the root lockfile, so `npm ci` failed in CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - frontend-web
    ignore:
      # Keep types in line with the Node runtime used in CI (Node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops `baseUrl` (TS5102) and the JS compiler API that
      # `next build` type-checks with; revisit once Next.js supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react*"
          - "@types/react*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss*"

  # GitHub Actions (workflow versiyalari)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
