version: 2

updates:
  # Backend Python dependencies
  - package-ecosystem: pip
    directory: /packages/backend/requirements
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - backend
    ignore:
      # Django 6.x requires Python 3.12+; the backend runs on 3.11 and stays on
      # the 5.2 LTS line until the Python upgrade.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
    groups:
      django:
        patterns:
          - "django*"
      testing:
        patterns:
          - "pytest*"
          - "factory-boy"
          - "coverage"
      # The OpenTelemetry distro pins exact instrumentation/exporter versions,
      # so single-package bumps never resolve.
      opentelemetry:
        patterns:
          - "opentelemetry-*"

  # npm workspaces (root package-lock.json covers packages/frontend-web and
  # packages/shared). A separate /packages/frontend-web entry produced PRs that
  # changed package.json without the root lockfile, so `npm ci` failed in CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - frontend-web
    ignore:
      # Keep types in line with the Node runtime used in CI (Node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react*"
          - "@types/react*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss*"

  # GitHub Actions (workflow versiyalari)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
