# H08: semantic versioning. release-please reads Conventional Commits on main, keeps a
# release PR with the next version and CHANGELOG.md, and tags vX.Y.Z when that PR is
# merged. A tag builds versioned images (build-and-push.yml); it does not deploy.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
