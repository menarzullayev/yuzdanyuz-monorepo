name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Bir branch uchun bir vaqtning o'zida faqat bitta CI ishga tushadi
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Lint — tezkor (pre-commit hooks barcha faylda)
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit==4.7.0

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      - name: Run pre-commit (commit-stage hooks)
        run: pre-commit run --all-files --hook-stage pre-commit

  # ──────────────────────────────────────────────────────────────────
  # Backend — Django + Pytest (PostgreSQL + Redis services)
  # ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Django + Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yuzdanyuz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: packages/backend

    env:
      DJANGO_SETTINGS_MODULE: core.settings.test
      SECRET_KEY: ci-test-secret-key-not-for-production
      DB_NAME: yuzdanyuz_test
      TEST_DB_NAME: yuzdanyuz_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/1
      ENABLE_RLS: 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/backend/requirements/*.txt

      - name: Install system dependencies
        # fonts-dejavu-core: the same TrueType font the image ships (watermark, PDF report)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements/development.txt

      - name: Dependency audit (pip-audit, known CVEs)
        run: |
          pip install pip-audit==2.10.0
          pip-audit -r requirements/production.txt -r requirements/development.txt --progress-spinner off

      - name: Django system check
        run: python manage.py check --fail-level WARNING

      # D04: the schema must build and validate; undocumented endpoints may only decrease.
      - name: OpenAPI schema gate
        run: python scripts/check_api_schema.py

      - name: Pytest — unit tests
        run: python -m pytest tests/unit/ apps/*/tests.py --tb=short -q -n auto --cov=apps --cov=core --cov-append --cov-report=

      - name: Pytest — integration tests
        run: python -m pytest tests/integration/ --tb=short -q -n auto --cov=apps --cov=core --cov-append --cov-report=

      - name: Pytest — security tests
        run: python -m pytest tests/security/ --tb=short -q -n auto --cov=apps --cov=core --cov-append --cov-report=

      # Blocking (audit H02): this gate used to be continue-on-error. Coverage comes
      # from the three runs above (--cov-append) instead of a fourth run of everything
      # in one session, where tests relying on data-migration rows got them flushed.
      - name: Coverage gate (ISSUE-115)
        run: python -m coverage report --show-missing --skip-covered --fail-under=70

  # ──────────────────────────────────────────────────────────────────
  # Frontend Web — Next.js (TS check + lint + build)
  # ──────────────────────────────────────────────────────────────────
  frontend-web:
    name: Frontend Web (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/frontend-web

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace)
        working-directory: .
        run: npm ci

      - name: Dependency audit (npm, high and critical)
        working-directory: .
        run: npm audit --audit-level=high

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8013

      # I03: first-load JS per route and total client JS stay within bundle-budget.json
      - name: Bundle budget
        run: npm run check:budget

  # ──────────────────────────────────────────────────────────────────
  # Secrets — gitleaks over the full history + rule self-test
  # ──────────────────────────────────────────────────────────────────
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks

      - name: Rule self-test (must catch fakes, ignore placeholders)
        run: bash scripts/test-gitleaks-rules.sh

      # Full history of the checked-out commit only. With fetch-depth 0 the default
      # (`git log --all`) also scans every other branch, so one branch with a
      # finding failed every PR.
      - name: Scan full git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="HEAD"

  # ──────────────────────────────────────────────────────────────────
  # Ops config — workflows, alert rules, Alertmanager, Terraform
  # ──────────────────────────────────────────────────────────────────
  ops-config:
    name: Ops config (actionlint, promtool, amtool, terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: actionlint (GitHub workflows)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Alert rules parse (promtool check rules)
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.16.0 \
            check rules charts/yuzdanyuz/files/prometheus-rules.yml

      - name: Alert rules fire on bad series only (promtool test rules)
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.16.0 \
            test rules monitoring/prometheus/tests/rules-test.yml

      - name: Prometheus + Alertmanager configs (compose monitoring stack)
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.16.0 \
            check config --syntax-only monitoring/prometheus/prometheus.yml
          docker run --rm -v "$PWD:/w" -w /w --entrypoint amtool prom/alertmanager:v0.35.0 \
            check-config monitoring/alertmanager/alertmanager.yml

      - name: Terraform fmt + validate (Cloudflare, nothing applied)
        run: |
          docker run --rm -v "$PWD/terraform/cloudflare:/tf" -w /tf --entrypoint sh hashicorp/terraform:1.17.2 -c \
            'terraform fmt -check -recursive && terraform init -backend=false -input=false >/dev/null && terraform validate'

  # ──────────────────────────────────────────────────────────────────
  # E2E — Playwright against the real stack (H10) with axe checks (I01)
  # ──────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yuzdanyuz_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      SECRET_KEY: e2e-only-not-a-secret
      DB_NAME: yuzdanyuz_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CHANNELS_REDIS_URL: redis://127.0.0.1:6379/2
      E2E_BASE_URL: http://localhost:3107
      E2E_USERNAME: e2e.student
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/backend/requirements/*.txt

      - name: Backend up (migrate, seed, runserver, celery worker)
        working-directory: packages/backend
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev fonts-dejavu-core
          pip install -r requirements/development.txt
          python manage.py migrate --noinput
          E2E_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$E2E_PASSWORD"
          echo "E2E_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          seed="$(E2E_PASSWORD="$E2E_PASSWORD" python manage.py e2e_seed)"
          echo "E2E_MOCK_LONG=$(echo "$seed" | python -c 'import json,sys;print(json.load(sys.stdin)["mocks"]["long"])')" >> "$GITHUB_ENV"
          echo "E2E_MOCK_SHORT=$(echo "$seed" | python -c 'import json,sys;print(json.load(sys.stdin)["mocks"]["short"])')" >> "$GITHUB_ENV"
          nohup python manage.py runserver 127.0.0.1:8013 --noreload > /tmp/django.log 2>&1 &
          nohup celery -A core worker -Q default,celery,critical,realtime,batch --concurrency 2 > /tmp/celery.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8013/health/ && break; sleep 2; done

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Web up (build, start)
        run: |
          npm ci
          cd packages/frontend-web
          npm run build
          nohup npx next start -p 3107 > /tmp/next.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:3107/ -o /dev/null && break; sleep 2; done
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: packages/frontend-web
        run: npx playwright test

      - name: Logs and report on failure
        if: failure()
        run: tail -n 80 /tmp/django.log /tmp/celery.log /tmp/next.log || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend-web/playwright-report
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Aggregator — barcha job'lar yashilmi (branch protection uchun)
  # ──────────────────────────────────────────────────────────────────
  all-checks-passed:
    name: All Checks Passed
    if: always()
    needs: [lint, backend, frontend-web, e2e, secrets, ops-config]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "❌ Backend failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-web.result }}" != "success" ]]; then
            echo "❌ Frontend Web failed"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "❌ E2E failed"
            exit 1
          fi
          if [[ "${{ needs.secrets.result }}" != "success" ]]; then
            echo "❌ Secrets scan failed"
            exit 1
          fi
          if [[ "${{ needs.ops-config.result }}" != "success" ]]; then
            echo "❌ Ops config failed"
            exit 1
          fi
          echo "✅ Hammasi yashil"
