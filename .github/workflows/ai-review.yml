# H06: automatic code review on every pull request (owner decision 2026-11-26: AI review
# on each PR; serious findings are fixed before merge). Runs Claude Code with the
# subscription token in the CLAUDE_CODE_OAUTH_TOKEN secret and posts one sticky comment.
# Until the secret exists the job says so and passes, so it never blocks merges by accident.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review (Claude)
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Token present?
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN secret is not set; skipping the AI review"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read the diff against the base branch and the files it touches. Follow the project
            rules in .claude/CLAUDE.md (tenant isolation, RLS, no secrets, negative tests).
            Report only real problems: correctness bugs, security holes (auth, tenant leaks,
            injection, secrets), data loss, missing negative tests for new checks, and broken
            migrations. For each: file:line, what goes wrong and when, and a concrete fix.
            Start the comment with "VERDICT: BLOCKING" when any finding must be fixed before
            merge, otherwise "VERDICT: OK". Do not praise, do not summarise the PR.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*)"'
