name: Build & Push images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'docker/**'
      - 'packages/backend/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write           # required to push to ghcr.io
  id-token: write           # for cosign keyless signing (future)

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yuzdanyuz-backend
            dockerfile: docker/Dockerfile.backend
          - image: yuzdanyuz-nginx
            dockerfile: docker/Dockerfile.nginx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # PRs build but don't push (security: avoid trusting fork code with creds)
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false   # disable until we fully wire up cosign / SLSA

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint chart
        run: |
          helm lint charts/yuzdanyuz \
            --values charts/yuzdanyuz/values.yaml \
            --values charts/yuzdanyuz/values-prod.yaml
      - name: Render template (smoke test)
        run: |
          helm template yuzdanyuz charts/yuzdanyuz \
            --values charts/yuzdanyuz/values.yaml \
            --values charts/yuzdanyuz/values-prod.yaml > /tmp/rendered.yaml
          wc -l /tmp/rendered.yaml
          # Sanity — at least 200 lines means the chart actually rendered something
          test "$(wc -l < /tmp/rendered.yaml)" -gt 200
