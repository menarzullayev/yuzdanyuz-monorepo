# Default values — overridden by values-{dev,staging,prod}.yaml.

global:
  domain: yuzdanyuz.local           # placeholder; overridden per env (e.g. yuzdanyuz.uz)
  imageRegistry: ghcr.io/menarzullayev
  # The GHCR packages are private (2026-11-11), so every pod needs a pull secret,
  # e.g. [{name: ghcr-pull}]; see docs/deployment/secrets.md. All pod templates
  # use it; scripts/check-helm-pull-secrets.py checks that in CI.
  imagePullSecrets: []

image:
  repository: yuzdanyuz-backend
  tag: latest                       # CI/CD overrides with git SHA
  pullPolicy: IfNotPresent

nginx:
  enabled: true
  image:
    repository: yuzdanyuz-nginx
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2

# Backend containers pass the entrypoint mode as `args`, never `command`: a k8s
# `command` replaces the image ENTRYPOINT (tini + /entrypoint.sh) and the pod would
# try to exec a binary called `web`. The chart fails to render if `command` is set.

# kubelet probes send this Host header; it must be in ALLOWED_HOSTS (prod.py always
# allows localhost). Health paths are exempt from SECURE_SSL_REDIRECT.
probes:
  host: localhost

# ── Web (gunicorn / WSGI) ────────────────────────────────────────────────────
web:
  replicas: 3
  args: ["web"]
  env:
    GUNICORN_WORKERS: "4"
    GUNICORN_THREADS: "2"
    GUNICORN_TIMEOUT: "30"
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1

# ── Channels (Daphne / ASGI for WebSocket) ───────────────────────────────────
channels:
  replicas: 2
  args: ["asgi"]
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ── Celery worker ────────────────────────────────────────────────────────────
# ISSUE-301: per-queue separate deployments (different SLO + resources).
# `celeryWorker` is the catch-all (`default,celery`). Each enabled worker below
# gets its own Deployment; a disabled one's queues fall back to the catch-all,
# so every queue routed in core/celery.py always has a consumer.
celeryWorker:
  replicas: 2
  args: ["worker"]
  env:
    CELERY_CONCURRENCY: "4"
    CELERY_QUEUES: "default,celery"
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }
  hpa:
    enabled: false  # autoscale by queue depth via KEDA (ISSUE-302)

# ISSUE-301: per-queue specialized workers
celeryWorkerCritical:
  enabled: true
  replicas: 3  # low-latency, more replicas for parallelism
  env:
    CELERY_CONCURRENCY: "8"   # fast tasks, high concurrency
    CELERY_QUEUES: "critical"
  resources:
    requests: { cpu: "300m", memory: "512Mi" }
    limits:   { cpu: "1500m", memory: "1Gi" }

celeryWorkerAI:
  enabled: true
  # Every AI call runs `claude -p` on one shared Claude subscription. Parallel
  # calls = replicas × CELERY_CONCURRENCY (here 1 × 2); KEDA never goes past
  # maxReplicas. Raise both only with the subscription's limits in mind.
  replicas: 1
  maxReplicas: 1
  env:
    CELERY_CONCURRENCY: "2"   # low concurrency, each task ~10-60s
    CELERY_QUEUES: "ai"
    CELERY_TASK_TIME_LIMIT: "180"  # 3 min hard limit (Anthropic timeout)
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }

celeryWorkerRealtime:
  enabled: true
  replicas: 2
  env:
    CELERY_CONCURRENCY: "4"
    CELERY_QUEUES: "realtime"
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "800m", memory: "512Mi" }

celeryWorkerBatch:
  enabled: true
  replicas: 1  # batch can wait, fewer replicas
  env:
    CELERY_CONCURRENCY: "2"
    CELERY_QUEUES: "batch"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ── Celery beat (single replica — distributed lock not implemented) ──────────
celeryBeat:
  replicas: 1
  args: ["beat"]
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }

# ── Migration Job (runs on each release) ─────────────────────────────────────
migrate:
  enabled: true
  backoffLimit: 3
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ── Backup CronJob (encrypted pg_dump -> rclone) ─────────────────────────────
# docker/Dockerfile.backup; runbook: docs/operations/backup-restore.md.
# When enabled, destination, gpgPublicKey and rcloneSecret are REQUIRED — the chart
# refuses to render without them instead of shipping a backup that silently fails.
backup:
  enabled: false
  schedule: "0 3 * * *"             # 03:00 UTC daily
  image:
    repository: yuzdanyuz-backup
    tag: ""                         # defaults to image.tag (same commit as the backend)
    pullPolicy: IfNotPresent
  # rclone `remote:path`; the remote named here is configured by RCLONE_CONFIG_<REMOTE>_*
  # keys in rcloneSecret, e.g. RCLONE_CONFIG_DEST_TYPE=s3 + provider/endpoint/keys.
  destination: ""
  rcloneSecret: ""
  # ASCII-armored PUBLIC key of the backup recipient. The private key stays offline.
  gpgPublicKey: ""
  retentionDays: 30
  activeDeadlineSeconds: 3600
  workDirSizeLimit: 20Gi            # holds one compressed dump + its encrypted copy
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }

# ── ISSUE-302: KEDA queue-depth autoscaling ──────────────────────────────────
keda:
  enabled: false  # opt-in — needs KEDA operator pre-installed in cluster

# ── Service / Ingress ────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
  tls:
    enabled: true
    secretName: yuzdanyuz-tls       # cert-manager populates this
  # Subdomain routing for white-label tenants
  hosts:
    - host: yuzdanyuz.local
      paths:
        - path: /
          pathType: Prefix
          service: nginx
        - path: /ws/
          pathType: Prefix
          service: channels

# ── Client IP: trusted reverse proxies (core/utils/client_ip.py) ──────────────
# Rendered into TRUSTED_PROXY_CIDRS. Django only believes CF-Connecting-IP /
# X-Forwarded-For when the connecting peer is in this list; empty = trust nothing,
# so every request looks like it comes from the nginx pod and all clients share
# one rate-limit / login-throttle bucket.
trustedProxy:
  # The cluster's pod CIDR (covers ingress-nginx and the release's nginx pods).
  clusterCidrs: []
  # Anything else in front, e.g. Cloudflare ranges.
  extraCidrs: []
  # true = refuse to render while clusterCidrs is empty (set in values-prod).
  required: false

# ── Common environment (ConfigMap) ───────────────────────────────────────────
env:
  DJANGO_SETTINGS_MODULE: core.settings.prod
  DJANGO_ENV: prod
  ENABLE_RLS: "true"
  ENABLE_AI_PARSER: "true"
  CELERY_TIMEZONE: Asia/Tashkent
  LOG_LEVEL: INFO
  # Observability — opted into by setting OTEL_ENABLED + SENTRY_DSN
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: yuzdanyuz-backend
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  SENTRY_TRACES_SAMPLE_RATE: "0.1"
  # ClickHouse — stub mode toggle
  CLICKHOUSE_ENABLED: "false"
  # Payments — stub mode (PR #35 default)
  ENABLE_REAL_PAYMENTS: "false"
  # AI: date the CLAUDE_CODE_OAUTH_TOKEN secret expires (`claude setup-token` + 1 year,
  # YYYY-MM-DD). Not secret. Drives the system check and the daily expiry reminder.
  CLAUDE_CODE_OAUTH_TOKEN_EXPIRES: ""

# ── Secret keys (must be created out-of-band via kubectl create secret) ──────
# Helm intentionally does NOT manage the Secret content — it only references it.
# See: docs/deployment/secrets.md
secretRef:
  name: yuzdanyuz-secrets
  keys:
    - SECRET_KEY
    - DB_PASSWORD
    - REDIS_URL
    - CHANNELS_REDIS_URL
    - CELERY_BROKER_URL
    - SENTRY_DSN
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - YANDEX_CLIENT_ID
    - YANDEX_CLIENT_SECRET
    - APPLE_CLIENT_ID
    - APPLE_SECRET
    - APPLE_PRIVATE_KEY
    - TELEGRAM_BOT_TOKEN
    - TELEGRAM_BOT_USERNAME
    - TELEGRAM_WEBHOOK_SECRET
    - PLAYMOBILE_LOGIN
    - PLAYMOBILE_PASSWORD
    - PAYME_MERCHANT_ID
    - PAYME_MERCHANT_KEY
    - CLICK_MERCHANT_ID
    - CLICK_SECRET_KEY
    - ANTHROPIC_API_KEY
    - CLAUDE_CODE_OAUTH_TOKEN   # `claude setup-token`; used when LLM_BACKEND=claude_cli (default)

# ── DB / Redis hostnames (assume managed services or separate Helm release) ──
externalServices:
  postgres:
    host: postgres-primary
    port: 5432
    name: yuzdanyuz_db
    user: yuzdanyuz
    # TLS to Postgres (libpq sslmode). values-prod: require; verify-full once the CA is
    # known (sslrootcert "system" = the OS trust store, enough for a public-CA provider).
    sslmode: prefer
    sslrootcert: ""
    # The server's max_connections; the chart refuses pool sizes that would exceed it.
    maxConnections: 100
  redis:
    host: redis-master
    port: 6379

# ── PgBouncer (transaction pooling, E05) ─────────────────────────────────────
# Web (HPA up to 30 pods x 8 threads), Channels and Celery would otherwise open
# hundreds of Postgres connections. Every app pod talks to PgBouncer; only the
# migrate Job and the backup CronJob connect to Postgres directly.
# RLS stays correct: the org variable is transaction-local (core/db_rls.py).
pgbouncer:
  enabled: true
  replicas: 2
  image:
    repository: edoburu/pgbouncer
    tag: v1.25.2-p0
    pullPolicy: IfNotPresent
  maxClientConn: 2000
  defaultPoolSize: 20
  reservePoolSize: 5
  # Server connections per replica: web/channels pool + Celery pool. Together with
  # replicas they must stay under externalServices.postgres.maxConnections minus
  # reservedConnections (migrations, backup, admin shells, monitoring).
  maxDbConnections: 30
  workerMaxDbConnections: 10
  reservedConnections: 15
  # statement_timeout per pool (ms): requests are killed long before gunicorn's 30 s,
  # Celery gets the task hard limit (CELERY_TASK_TIME_LIMIT=300 s).
  statementTimeoutMs: 25000
  workerStatementTimeoutMs: 300000
  # A client waiting this long for a free server connection gets an error instead
  # of hanging the gunicorn thread.
  queryWaitTimeout: 15
  # Kills sessions that sit "idle in transaction" and pin a server connection.
  idleTransactionTimeout: 60
  # App -> PgBouncer stays inside the namespace (NetworkPolicy); PgBouncer -> Postgres
  # uses externalServices.postgres.sslmode.
  clientSslmode: prefer
  resources:
    requests: { cpu: "50m",  memory: "32Mi" }
    limits:   { cpu: "500m", memory: "128Mi" }
  pdb:
    minAvailable: 1

# ── Pod Security Context ─────────────────────────────────────────────────────
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false   # Django uses /tmp; set true after audit

# ── Network Policy ───────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  # Egress allowed to: postgres, redis, otel-collector, sentry.io,
  # api.anthropic.com, api.telegram.org, payments providers, SMTP gateway.

# ── ServiceMonitor (Prometheus Operator) ─────────────────────────────────────
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
