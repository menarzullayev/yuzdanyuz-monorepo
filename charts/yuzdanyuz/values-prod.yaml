# prod overlay — full HA + autoscaling + backup + observability.
global:
  domain: yuzdanyuz.uz
  # GHCR images are private: create this docker-registry secret first
  # (docs/deployment/secrets.md, "GHCR pull secret").
  imagePullSecrets:
    - name: ghcr-pull

web:
  replicas: 4
  hpa:
    minReplicas: 4
    maxReplicas: 30
    targetCPUUtilizationPercentage: 60

channels:
  replicas: 3
  hpa:
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 60

celeryWorker:
  replicas: 4

celeryBeat:
  replicas: 1

env:
  DJANGO_ENV: prod
  LOG_LEVEL: INFO
  OTEL_ENABLED: "true"
  SENTRY_TRACES_SAMPLE_RATE: "0.05"   # 5% in prod (cost-sensitive)

ingress:
  hosts:
    - host: yuzdanyuz.uz
      paths:
        - path: /
          pathType: Prefix
          service: nginx
        - path: /ws/
          pathType: Prefix
          service: channels
    - host: api.yuzdanyuz.uz
      paths:
        - path: /
          pathType: Prefix
          service: nginx

backup:
  enabled: true
  schedule: "0 3 * * *"
  retentionDays: 30
  # REQUIRED before the first prod deploy (rendering fails while empty) — open
  # question for the owner: where the encrypted dumps live (S3 bucket / SFTP host /
  # other rclone remote). Supply at deploy time, e.g.
  #   --set backup.destination=dest:yuzdanyuz-backups/postgres
  #   --set backup.rcloneSecret=yuzdanyuz-backup-rclone
  #   --set-file backup.gpgPublicKey=backup-public.asc
  # Runbook: docs/operations/backup-restore.md
  destination: ""
  rcloneSecret: ""
  gpgPublicKey: ""
