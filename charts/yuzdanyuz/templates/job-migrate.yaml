{{- if .Values.migrate.enabled }}
{{- if eq .Values.externalServices.postgres.migrateUser .Values.externalServices.postgres.user }}
{{- fail "externalServices.postgres.migrateUser must differ from externalServices.postgres.user: the runtime role must not own the tables (audit B15, docs/deployment/database-roles.md)" }}
{{- end }}
# One-shot Job that runs migrations + collectstatic on each Helm release.
# Helm hook ensures it completes before main deployments are upgraded.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "yuzdanyuz.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "yuzdanyuz.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "yuzdanyuz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "yuzdanyuz.fullname" . }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "yuzdanyuz.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          envFrom: {{- include "yuzdanyuz.envFrom" . | nindent 12 }}
          # Straight to Postgres, no statement timeout: migrations build indexes
          # CONCURRENTLY and must not be cut off by the pooled request timeout.
          env:
            {{- include "yuzdanyuz.directDbEnv" . | nindent 12 }}
            - name: DB_STATEMENT_TIMEOUT_MS
              value: "0"
            # Owner role (audit B15): only this Job may change the schema. DB_RUNTIME_ROLE
            # gets DML grants after every migrate (core/db_roles.py).
            - name: DB_USER
              value: {{ .Values.externalServices.postgres.migrateUser | quote }}
            - name: DB_RUNTIME_ROLE
              value: {{ .Values.externalServices.postgres.user | quote }}
            # Runtime-only settings (bot webhook secret, payment keys) are not given to this
            # Job, so their system checks are skipped here; the static files ship in the image.
            - name: MIGRATE_SKIP_CHECKS
              value: "true"
            - name: MIGRATE_COLLECTSTATIC
              value: "false"
            {{- include "yuzdanyuz.secretEnv" (dict "root" $ "keys" .Values.secretRef.migrate "as" (dict "DB_PASSWORD" "DB_MIGRATE_PASSWORD")) | nindent 12 }}
          resources: {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts: {{- include "yuzdanyuz.tmpMount" . | nindent 12 }}
      volumes: {{- include "yuzdanyuz.tmpVolume" . | nindent 8 }}
{{- end }}
