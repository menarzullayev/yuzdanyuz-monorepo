{{- if .Values.migrate.enabled }}
# One-shot Job that runs migrations + collectstatic on each Helm release.
# Helm hook ensures it completes before main deployments are upgraded.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "yuzdanyuz.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "yuzdanyuz.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "yuzdanyuz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "yuzdanyuz.fullname" . }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "yuzdanyuz.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["migrate"]
          envFrom: {{- include "yuzdanyuz.envFrom" . | nindent 12 }}
          resources: {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
