{{- if .Values.nginx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yuzdanyuz.fullname" . }}-nginx
  labels:
    {{- include "yuzdanyuz.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "yuzdanyuz.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "yuzdanyuz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
    spec:
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: {{ include "yuzdanyuz.nginxImage" . }}
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # docker/nginx/templates/upstreams.conf.template; must match templates/services.yaml
            - name: BACKEND_UPSTREAM
              value: "{{ include "yuzdanyuz.fullname" . }}-web:{{ .Values.service.port }}"
            - name: CHANNELS_UPSTREAM
              value: "{{ include "yuzdanyuz.fullname" . }}-channels:{{ .Values.service.port }}"
          livenessProbe:
            httpGet:
              path: /health/
              port: http
              {{- include "yuzdanyuz.probeHeaders" . | nindent 14 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/
              port: http
              {{- include "yuzdanyuz.probeHeaders" . | nindent 14 }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          volumeMounts:
            - name: media
              mountPath: /var/www/media
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            # the image entrypoint renders the upstreams here; the pod runs non-root
            - name: upstreams
              mountPath: /etc/nginx/upstreams
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "yuzdanyuz.fullname" . }}-media
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: upstreams
          emptyDir: {}
{{- end }}
