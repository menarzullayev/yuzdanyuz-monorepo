{{- if .Values.nginx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yuzdanyuz.fullname" . }}-nginx
  labels:
    {{- include "yuzdanyuz.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "yuzdanyuz.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "yuzdanyuz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
    spec:
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # F05: nginx serves the hashed static files itself (the emptyDir used to stay
      # empty and every asset fell through to Django). Copied from the backend image
      # of the same release, so names always match the deployed manifest.
      initContainers:
        - name: static
          image: {{ include "yuzdanyuz.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["copy-static", "/static"]
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: static
              mountPath: /static
            {{- include "yuzdanyuz.tmpMount" . | nindent 12 }}
      containers:
        - name: nginx
          image: {{ include "yuzdanyuz.nginxImage" . }}
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # docker/nginx/templates/upstreams.conf.template; must match templates/services.yaml
            - name: BACKEND_UPSTREAM
              value: "{{ include "yuzdanyuz.fullname" . }}-web:{{ .Values.service.port }}"
            - name: CHANNELS_UPSTREAM
              value: "{{ include "yuzdanyuz.fullname" . }}-channels:{{ .Values.service.port }}"
          livenessProbe:
            httpGet:
              path: /health/
              port: http
              {{- include "yuzdanyuz.probeHeaders" . | nindent 14 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/
              port: http
              {{- include "yuzdanyuz.probeHeaders" . | nindent 14 }}
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          volumeMounts:
            - name: static
              mountPath: /var/www/static
              readOnly: true
            - name: media
              mountPath: /var/www/media
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            {{- include "yuzdanyuz.tmpMount" . | nindent 12 }}
            # the image entrypoint renders the upstreams here; the pod runs non-root
            - name: upstreams
              mountPath: /etc/nginx/upstreams
      volumes:
        - name: static
          emptyDir:
            sizeLimit: 512Mi
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "yuzdanyuz.fullname" . }}-media
        - name: cache
          emptyDir: {}
        {{- include "yuzdanyuz.tmpVolume" . | nindent 8 }}
        - name: upstreams
          emptyDir: {}
{{- end }}
