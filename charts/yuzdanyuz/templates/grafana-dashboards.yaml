{{- if .Values.grafanaDashboards.enabled }}
# Grafana dashboards from files/dashboards/. kube-prometheus-stack's Grafana
# sidecar imports every ConfigMap carrying grafanaDashboards.labels
# (default grafana_dashboard: "1"), from any namespace when searchNamespace=ALL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yuzdanyuz.fullname" . }}-grafana-dashboards
  labels:
    {{- include "yuzdanyuz.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboards.folder }}
  annotations:
    grafana_folder: {{ . | quote }}
  {{- end }}
data:
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
