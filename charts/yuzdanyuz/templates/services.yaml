apiVersion: v1
kind: Service
metadata:
  name: {{ include "yuzdanyuz.fullname" . }}-web
  labels:
    {{- include "yuzdanyuz.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "yuzdanyuz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yuzdanyuz.fullname" . }}-channels
  labels:
    {{- include "yuzdanyuz.labels" . | nindent 4 }}
    app.kubernetes.io/component: channels
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "yuzdanyuz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: channels
{{- if .Values.nginx.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yuzdanyuz.fullname" . }}-nginx
  labels:
    {{- include "yuzdanyuz.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "yuzdanyuz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
{{- end }}
