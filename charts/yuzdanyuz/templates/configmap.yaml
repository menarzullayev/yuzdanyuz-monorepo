apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yuzdanyuz.fullname" . }}-env
  labels: {{- include "yuzdanyuz.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
  ALLOWED_HOSTS: {{ include "yuzdanyuz.allowedHosts" . | quote }}
  {{- $proxies := concat .Values.trustedProxy.clusterCidrs .Values.trustedProxy.extraCidrs }}
  {{- if and .Values.trustedProxy.required (not .Values.trustedProxy.clusterCidrs) }}
  {{- fail "trustedProxy.required=true but trustedProxy.clusterCidrs is empty: set the cluster pod CIDR (see values-prod.yaml), otherwise every client shares the nginx pod's IP for rate limiting." }}
  {{- end }}
  {{- if $proxies }}
  TRUSTED_PROXY_CIDRS: {{ $proxies | join "," | quote }}
  {{- end }}
  {{- $pg := .Values.externalServices.postgres }}
  {{- if .Values.pgbouncer.enabled }}
  # E05: app pods reach Postgres only through PgBouncer (templates/pgbouncer.yaml)
  DB_HOST: {{ printf "%s-pgbouncer" (include "yuzdanyuz.fullname" .) | quote }}
  DB_PORT: "6432"
  DB_POOLER: pgbouncer
  DB_SSLMODE: {{ .Values.pgbouncer.clientSslmode | quote }}
  {{- else }}
  DB_HOST: {{ $pg.host | quote }}
  DB_PORT: {{ $pg.port | quote }}
  DB_SSLMODE: {{ $pg.sslmode | quote }}
  {{- with $pg.sslrootcert }}
  DB_SSLROOTCERT: {{ . | quote }}
  {{- end }}
  {{- end }}
  DB_NAME: {{ $pg.name | quote }}
  DB_USER: {{ $pg.user | quote }}
