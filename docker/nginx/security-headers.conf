# Included in the server block and in every location that sets its own add_header
# (nginx does not inherit add_header into such locations).
# $csp_fallback (default.conf) is empty when Django already sent a policy, so nginx only
# adds one to the responses it produces itself: static/media files and its error pages.
add_header Content-Security-Policy $csp_fallback always;
add_header X-Content-Type-Options "nosniff" always;
