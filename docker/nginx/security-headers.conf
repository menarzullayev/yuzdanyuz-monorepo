# Included in the server block and in every location that sets its own add_header
# (nginx does not inherit add_header into such locations).
# $csp_fallback (default.conf) is empty when Django already sent a policy, so nginx only
# adds one to the responses it produces itself: static/media files and its error pages.
add_header Content-Security-Policy $csp_fallback always;
add_header X-Content-Type-Options "nosniff" always;
# C15: browser features the site never uses are switched off for it and for any
# frame. The microphone stays available to our own origin for Speaking answers.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), browsing-topics=()" always;
