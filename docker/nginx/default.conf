# C14: strict CSP for responses nginx generates itself (files, error pages); responses
# from Django carry their own policy and are left alone.
map $upstream_http_content_security_policy $csp_fallback {
    ''      "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    default '';
}

server {
    # unprivileged port: the image runs as the nginx user (docker/Dockerfile.nginx)
    listen 8080 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # Static + media — served directly, bypassing Django
    # Compose mounts collected static here; the Helm chart mounts nothing, so a miss
    # falls through to Django, which serves the image's collectstatic via WhiteNoise.
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri @django_static;
    }

    location @django_static {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # WebSocket — channels (Daphne)
    location /ws/ {
        proxy_pass http://django_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Prometheus metrics — internal-only (allow K8s service mesh / scraper)
    location /metrics {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Restrict to private CIDRs in K8s overlay; permissive default for compose
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # deny all;
    }

    # Health endpoint — used by liveness/readiness probes
    # Host is pinned: probes reach nginx by pod IP / 127.0.0.1, which Django's
    # ALLOWED_HOSTS does not list; localhost always is.
    location = /health/ {
        proxy_pass http://django_web;
        access_log off;
        proxy_set_header Host localhost;
    }

    # Default — Django (gunicorn WSGI)
    location / {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
