user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log (JSON) — friendly to log aggregators
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"size":$body_bytes_sent,'
        '"referrer":"$http_referer","ua":"$http_user_agent","rt":$request_time,'
        '"upstream_rt":"$upstream_response_time","host":"$host"}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    client_max_body_size  20m;
    client_body_buffer_size 256k;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Upstreams — overridable via env in K8s ingress; here for docker-compose
    upstream django_web  { server backend:8000 max_fails=3 fail_timeout=5s; }
    upstream django_asgi { server channels:8000 max_fails=3 fail_timeout=5s; }

    include /etc/nginx/conf.d/*.conf;
}
