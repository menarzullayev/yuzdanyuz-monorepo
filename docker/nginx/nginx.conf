user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log (JSON) — friendly to log aggregators
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"size":$body_bytes_sent,'
        '"referrer":"$http_referer","ua":"$http_user_agent","rt":$request_time,'
        '"upstream_rt":"$upstream_response_time","host":"$host"}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    client_max_body_size  20m;
    client_body_buffer_size 256k;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Behind a TLS-terminating proxy (k8s ingress, Cloudflare) the original scheme
    # arrives in X-Forwarded-Proto; overwriting it with our own $scheme (always http
    # here) makes Django's SECURE_SSL_REDIRECT answer every request with a 301 loop.
    # Only http/https pass through; anything else falls back to $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http    http;
        https   https;
    }

    # Upstreams (django_web, django_asgi) are rendered at container start from
    # templates/upstreams.conf.template with BACKEND_UPSTREAM / CHANNELS_UPSTREAM:
    # compose uses the defaults (backend:8000, channels:8000), Helm sets the Service names.
    include /etc/nginx/upstreams/*.conf;

    include /etc/nginx/conf.d/*.conf;
}
