; Local compose PgBouncer — same pooling mode and pools as the Helm chart
; (charts/yuzdanyuz/templates/pgbouncer.yaml), sized for one laptop.
[databases]
yuzdanyuz_db = host=postgres port=5432 dbname=yuzdanyuz_db max_db_connections=20 connect_query='SET statement_timeout = 25000'
yuzdanyuz_db_worker = host=postgres port=5432 dbname=yuzdanyuz_db max_db_connections=10 connect_query='SET statement_timeout = 300000'

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer-run/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 10
reserve_pool_size = 2
ignore_startup_parameters = extra_float_digits
server_connect_timeout = 5
server_login_retry = 5
query_wait_timeout = 15
idle_transaction_timeout = 60
tcp_keepalive = 1
