; E05 test stack only (rls-test.compose.yml). ONE server connection per pool, so
; every client is multiplexed onto the same Postgres backend: any session-level
; state one client leaves behind is seen by the next.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = transaction
default_pool_size = 1
max_client_conn = 100
ignore_startup_parameters = extra_float_digits
